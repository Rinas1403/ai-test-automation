name: Playwright UI + API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project cần chạy: all | ui | api | ui-chrome | ui-edge | ui-firefox'
        required: false
        default: all

env:
  WORKERS: 5
  HEADLESS: 'true'
  BASE_URL: ${{ vars.BASE_URL || 'https://book.anhtester.com' }}
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://book.anhtester.com' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: playwright-typescript-framework
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-typescript-framework/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npx playwright install --with-deps chrome msedge firefox

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          case "$PROJECT" in
            ui)                          npm run test:ui ;;
            api|ui-chrome|ui-edge|ui-firefox) npx playwright test --project="$PROJECT" ;;
            *)                           npm test ;;
          esac

      - name: Sinh Allure report
        if: always()
        run: |
          npm run report:generate
          npm run report:single

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: playwright-typescript-framework/reports/
          retention-days: 14